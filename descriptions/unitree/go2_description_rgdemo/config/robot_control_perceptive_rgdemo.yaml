# Evaluation-only test1 perceptive controller config.
# This file is isolated from the original go2_description package.

controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    ocs2_quadruped_controller_rgdemo:
      type: ocs2_quadruped_controller_rgdemo/Ocs2QuadrupedController

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor"
    frame_id: "imu_link"

ocs2_quadruped_controller_rgdemo:
  ros__parameters:
    update_rate: 500
    robot_pkg: "go2_description_rgdemo"
    estimator_type: "ground_truth"
    odom_name: "odometer"
    odom_interfaces:
      - position.x
      - position.y
      - position.z
      - velocity.x
      - velocity.y
      - velocity.z
    enable_perceptive: true
    feet_force_threshold: 12.0
    default_kp: 30.0
    default_kd: 3.5
    joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint

    command_interfaces:
      - effort
      - position
      - velocity
      - kp
      - kd

    state_interfaces:
      - effort
      - position
      - velocity

    feet:
      - FL_foot
      - FR_foot
      - RL_foot
      - RR_foot

    imu_name: "imu_sensor"
    base_name: "base"

    imu_interfaces:
      - orientation.w
      - orientation.x
      - orientation.y
      - orientation.z
      - angular_velocity.x
      - angular_velocity.y
      - angular_velocity.z
      - linear_acceleration.x
      - linear_acceleration.y
      - linear_acceleration.z

    foot_force_name: "foot_force"
    foot_force_interfaces:
      - FL
      - RL
      - FR
      - RR

name: height_only_box_stand_bootstrap
publish_rate_hz: 50.0
timeout_sec: 12.0
monitoring_start_sec: 3.0
fall_detection:
  min_base_z: 0.03
  max_base_z_drop: 0.05
  max_abs_roll_deg: 55.0
  max_abs_pitch_deg: 55.0
steps:
  - name: enter_ocs2
    duration: 2.0
    command: 2
    lx: 0.0
    ly: 0.0
    rx: 0.0
    ry: 0.0
  - name: settle
    duration: 10.0
    command: 0
    lx: 0.0
    ly: 0.0
    rx: 0.0
    ry: 0.0

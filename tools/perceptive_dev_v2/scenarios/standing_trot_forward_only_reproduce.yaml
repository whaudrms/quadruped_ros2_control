name: standing_trot_forward_only_reproduce_dev_v2
# good_data reproduction variant. Keep the original command sequence and
# 5 s forward phase, but wait one additional second after FixedStand before
# requesting the OCS2 transition.
publish_rate_hz: 50.0
timeout_sec: 9.0
monitoring_start_sec: 4.0
initial_window_sec: 1.0
mujoco_startup_wait_sec: 2.5
controller_startup_wait_sec: 20.0
fall_detection:
  min_base_z: 0.03
  max_base_z_drop: 0.08
  max_abs_roll_deg: 60.0
  max_abs_pitch_deg: 60.0
steps:
  - name: stand_only
    duration: 1.0
    control_input:
      command: 2
      lx: 0.0
      ly: 0.0
      rx: 0.0
      ry: 0.0
    twist:
      linear: {x: 0.0, y: 0.0, z: 0.0}
      angular: {x: 0.0, y: 0.0, z: 0.0}
  - name: hold_after_stand
    duration: 1.5
    control_input:
      command: 0
      lx: 0.0
      ly: 0.0
      rx: 0.0
      ry: 0.0
    twist:
      linear: {x: 0.0, y: 0.0, z: 0.0}
      angular: {x: 0.0, y: 0.0, z: 0.0}
  - name: enter_ocs2
    duration: 0.5
    control_input:
      command: 4
      lx: 0.0
      ly: 0.0
      rx: 0.0
      ry: 0.0
    twist:
      linear: {x: 0.0, y: 0.0, z: 0.0}
      angular: {x: 0.0, y: 0.0, z: 0.0}
  - name: stabilize_gait
    duration: 1.0
    control_input:
      command: 0
      lx: 0.0
      ly: 0.0
      rx: 0.0
      ry: 0.0
    twist:
      linear: {x: 0.0, y: 0.0, z: 0.0}
      angular: {x: 0.0, y: 0.0, z: 0.0}
  - name: forward
    duration: 5.0
    control_input:
      command: 0
      lx: 0.0
      ly: 0.0
      rx: 0.0
      ry: 0.0
    twist:
      linear: {x: 0.3, y: 0.0, z: 0.0}
      angular: {x: 0.0, y: 0.0, z: 0.0}

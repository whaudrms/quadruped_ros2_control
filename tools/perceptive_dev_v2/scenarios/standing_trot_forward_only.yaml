name: standing_trot_forward_only_dev_v2
# After initial preparation (stand → enter OCS2 → brief stabilize), do
# EXACTLY 5 s of forward motion at 0.3 m/s. No "stop" phase at the end.
#
# Motivation: in standing_trot_forward_short.yaml we observed the post-
# descent stop phase (twist=0) interacting with a sizable yaw drift to
# push the robot backwards into box1's vertical face on basic_step_short,
# contaminating roll/yaw RMS for OFF trials. Removing the stop and
# committing to continuous forward motion eliminates that failure mode
# and isolates the descent + steady-walk portion that the robust phase
# is designed to affect.
#
# Total scenario length 8.0 s, monitoring window narrowed to the 5 s of
# forward motion only (start = 3.0 s, end = timeout 8.0 s).
publish_rate_hz: 50.0
timeout_sec: 8.0
monitoring_start_sec: 3.0
initial_window_sec: 1.0
mujoco_startup_wait_sec: 2.5
controller_startup_wait_sec: 20.0
fall_detection:
  min_base_z: 0.03
  max_base_z_drop: 0.08
  max_abs_roll_deg: 60.0
  max_abs_pitch_deg: 60.0
steps:
  - name: stand_only
    duration: 1.0
    control_input:
      command: 2
      lx: 0.0
      ly: 0.0
      rx: 0.0
      ry: 0.0
    twist:
      linear: {x: 0.0, y: 0.0, z: 0.0}
      angular: {x: 0.0, y: 0.0, z: 0.0}
  - name: hold_after_stand
    duration: 0.5
    control_input:
      command: 0
      lx: 0.0
      ly: 0.0
      rx: 0.0
      ry: 0.0
    twist:
      linear: {x: 0.0, y: 0.0, z: 0.0}
      angular: {x: 0.0, y: 0.0, z: 0.0}
  - name: enter_ocs2
    duration: 0.5
    control_input:
      command: 4
      lx: 0.0
      ly: 0.0
      rx: 0.0
      ry: 0.0
    twist:
      linear: {x: 0.0, y: 0.0, z: 0.0}
      angular: {x: 0.0, y: 0.0, z: 0.0}
  - name: stabilize_gait
    duration: 1.0
    control_input:
      command: 0
      lx: 0.0
      ly: 0.0
      rx: 0.0
      ry: 0.0
    twist:
      linear: {x: 0.0, y: 0.0, z: 0.0}
      angular: {x: 0.0, y: 0.0, z: 0.0}
  - name: forward
    duration: 5.0
    control_input:
      command: 0
      lx: 0.0
      ly: 0.0
      rx: 0.0
      ry: 0.0
    twist:
      linear: {x: 0.3, y: 0.0, z: 0.0}
      angular: {x: 0.0, y: 0.0, z: 0.0}

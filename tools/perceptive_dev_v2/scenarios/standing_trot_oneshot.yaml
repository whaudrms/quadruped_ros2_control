name: standing_trot_oneshot_dev_v2
publish_rate_hz: 50.0
timeout_sec: 11.0
monitoring_start_sec: 4.5
initial_window_sec: 1.0
mujoco_startup_wait_sec: 2.5
controller_startup_wait_sec: 20.0
fall_detection:
  min_base_z: 0.03
  max_base_z_drop: 0.08
  max_abs_roll_deg: 60.0
  max_abs_pitch_deg: 60.0
# Stage 9 — full-horizon 1-shot OCP variant.
# CRITICAL: twist.linear.x = 0.3 must be active in the publisher buffer BEFORE
# OCS2 entry, so TargetManager builds a forward reference trajectory for the
# single OCP solve. We send forward twist starting in the prep_forward step,
# and only THEN flip command to 4 (OCS2 entry).
#
# Timeline:
#   0.0-3.5s  stand_only        cmd=2, twist=0   (FixedStand stabilizes)
#   3.5-4.0s  prep_forward      cmd=2, twist=0.3 (twist preloaded into buffer)
#   4.0-4.5s  enter_ocs2        cmd=4, twist=0.3 (FSM transitions, OCP solves)
#   4.5-10.5s hold_descent      cmd=0, twist=0.3 (WBC tracks cached policy)
#   10.5-11s  stop              cmd=0, twist=0   (cooldown)
#
# Horizon: mpc.timeHorizon in task.info covers the t in [t_entry, t_entry+H].
# With H=4s the cached policy expires at trial t≈8s. Tweak via task.info if
# the descent isn't fully covered.
steps:
  - name: stand_only
    duration: 3.5
    control_input:
      command: 2
      lx: 0.0
      ly: 0.0
      rx: 0.0
      ry: 0.0
    twist:
      linear: {x: 0.0, y: 0.0, z: 0.0}
      angular: {x: 0.0, y: 0.0, z: 0.0}
  - name: prep_forward
    duration: 0.5
    control_input:
      command: 2
      lx: 0.0
      ly: 0.0
      rx: 0.0
      ry: 0.0
    twist:
      linear: {x: 0.15, y: 0.0, z: 0.0}
      angular: {x: 0.0, y: 0.0, z: 0.0}
  - name: enter_ocs2
    duration: 0.5
    control_input:
      command: 4
      lx: 0.0
      ly: 0.0
      rx: 0.0
      ry: 0.0
    twist:
      linear: {x: 0.15, y: 0.0, z: 0.0}
      angular: {x: 0.0, y: 0.0, z: 0.0}
  - name: hold_descent
    duration: 6.0
    control_input:
      command: 0
      lx: 0.0
      ly: 0.0
      rx: 0.0
      ry: 0.0
    twist:
      linear: {x: 0.15, y: 0.0, z: 0.0}
      angular: {x: 0.0, y: 0.0, z: 0.0}
  - name: stop
    duration: 0.5
    control_input:
      command: 0
      lx: 0.0
      ly: 0.0
      rx: 0.0
      ry: 0.0
    twist:
      linear: {x: 0.0, y: 0.0, z: 0.0}
      angular: {x: 0.0, y: 0.0, z: 0.0}
